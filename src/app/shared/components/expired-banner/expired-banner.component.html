<div
  class="w-full bg-primary-light/25 border border-primary/25 rounded-2xl px-6 py-5 flex flex-col sm:flex-row items-start sm:items-center gap-4">
  <div class="shrink-0 w-11 h-11 rounded-full bg-white flex items-center justify-center text-primary">
    <hugeicons-icon [icon]="calendarIcon" [size]="20" color="currentColor" [strokeWidth]="2" />
  </div>

  <div class="flex-1 min-w-0">
    <p class="font-cookie text-xl md:text-2xl text-heading leading-snug">
      {{ copy.bannerTitle }}
    </p>
    <p class="mt-1 text-sm text-theme-text leading-relaxed">
      {{ copy.bannerDeadlineLead }}
      <span class="font-semibold text-heading">{{ deadline }}</span>.
      {{ copy.bannerDeadlineTail }}
    </p>
  </div>

  <div role="status" [attr.aria-label]="copy.bannerStatus"
    class="shrink-0 flex items-center gap-1.5 bg-white border border-primary/25 text-primary text-xs font-semibold px-3 py-1.5 rounded-full">
    <hugeicons-icon [icon]="alertIcon" [size]="14" color="currentColor" [strokeWidth]="2" />
    {{ copy.bannerStatus }}
  </div>
</div>
