<div class="flex flex-col items-center justify-center gap-4 px-4 w-full">
    <div
        class="flex items-center justify-center w-20 h-20 md:w-24 md:h-24 rounded-full bg-green-100 mb-2 animate-pulse text-green-600">
        <hugeicons-icon [icon]="acceptedIcon" [size]="40" color="currentColor" [strokeWidth]="2" />
    </div>
    <h2 class="text-heading font-bold text-xl md:text-2xl lg:text-3xl text-center font-cookie">
        {{ copy.acceptedTitle }}
    </h2>
    <p class="text-theme-text text-sm md:text-base lg:text-lg text-center max-w-md">
        {{ copy.acceptedText }}
    </p>

    <div *ngIf="confirmedGuestNames.length > 0" class="mt-4 flex flex-col items-center gap-3 w-full max-w-xs">
        <div
            class="flex items-center justify-center w-12 h-12 md:w-14 md:h-14 rounded-full bg-primary text-white text-xl md:text-2xl font-bold">
            {{ confirmedGuestNames.length }}
        </div>
        <h3 class="text-heading font-bold text-base md:text-lg uppercase tracking-wider">
            {{ copy.guestsHeading }}
        </h3>
        <ul class="flex flex-col gap-2 w-full">
            <li *ngFor="let name of confirmedGuestNames"
                class="bg-surface-alt text-theme-text text-sm md:text-base text-center py-3 px-4 rounded-lg capitalize">
                {{ name }}
            </li>
        </ul>
    </div>
</div>
